[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short tracebacks; -v for verbose output
addopts = -v --tb=short

# Treat warnings as errors so nothing is silently ignored
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
