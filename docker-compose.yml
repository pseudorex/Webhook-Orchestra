services:

  backend:
    build: .
    container_name: webhook_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=webhook-backend
    depends_on:
      - redis
      - rabbitmq
      - jaeger
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker-high:
    build: .
    container_name: webhook_worker_high
    command: celery -A worker.celery_app:celery worker --loglevel=info --concurrency=4 -Q high_priority
    ports:
      - "8001:8001"
    environment:
      - METRICS_PORT=8001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=webhook-worker-high
    depends_on:
      - redis
      - rabbitmq
      - jaeger
    env_file:
      - .env
    volumes:
      - .:/app

  worker-retry:
    build: .
    container_name: webhook_worker_retry
    command: celery -A worker.celery_app:celery worker --loglevel=info --concurrency=2 -Q default,low_priority
    ports:
      - "8002:8002"
    environment:
      - METRICS_PORT=8002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=webhook-worker-retry
    depends_on:
      - redis
      - rabbitmq
      - jaeger
    env_file:
      - .env
    volumes:
      - .:/app

  rabbitmq:
    image: rabbitmq:3-management
    container_name: webhook_rabbitmq
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Management Dashboard

  redis:
    image: redis:7-alpine
    container_name: webhook_redis
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: webhook_jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC port
      - "4318:4318"   # OTLP HTTP port

  prometheus:
    image: prom/prometheus:latest
    container_name: webhook_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
      - worker-high
      - worker-retry

  grafana:
    image: grafana/grafana:latest
    container_name: webhook_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  grafana_data: